<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="referrer" content="no-referrer">
<title>AR 드로잉 가이드</title>
<style>
/*
VOICE  조용한 작업 도구 — 그림 그리는 동안 방해하지 않는다
IDEA   라이트박스(트레이싱 테이블)
PICTURE 카메라 화면 자체 + 주황 모서리 핸들
COLOUR 검정 반투명 패널, 흰 글자, 주황 포인트
LAYOUT 전체 화면 카메라, 하단 접이식 패널
*/
:root{--ui:rgba(16,16,18,.82);--ink:#fff;--mute:#b9b9c0;--acc:#ff5a36;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;margin:0;min-width:0}
html,body{height:100%;background:#000;color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
#stage{position:fixed;inset:0;touch-action:none;overflow:hidden}
#ov{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;max-width:none;will-change:transform}
#quad{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#quad polygon{fill:none;stroke:var(--acc);stroke-width:1.5;stroke-dasharray:6 5}
.h{position:absolute;left:0;top:0;width:48px;height:48px;margin:-24px 0 0 -24px;touch-action:none;display:grid;place-items:center;cursor:grab}
.h::after{content:"";width:18px;height:18px;border-radius:50%;background:var(--acc);border:2px solid #fff;box-shadow:0 1px 5px #0009}
.h[hidden],#quad[hidden]{display:none}
body.locked .h,body.locked #quad{display:none}
body.locked #stage{pointer-events:none}

#bar{position:fixed;left:0;right:0;bottom:0;padding:12px max(12px,env(safe-area-inset-left)) max(12px,env(safe-area-inset-bottom));background:var(--ui);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;gap:10px}
body.min #bar .full{display:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,.btn{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);font:inherit;font-size:14px;min-height:44px;padding:0 14px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
button:focus-visible,.btn:focus-within,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.on{background:var(--acc);border-color:var(--acc)}
button:disabled{opacity:.4}
.btn input{position:absolute;width:1px;height:1px;opacity:0}
.grow{flex:1}
label.sl{display:grid;grid-template-columns:4.5em minmax(0,1fr) 3em;align-items:center;gap:10px;color:var(--mute);font-size:13px}
label.sl output{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:44px;accent-color:var(--acc);background:transparent}
.hint{color:var(--mute);font-size:13px}
#edgeRow[hidden]{display:none}

#start{position:fixed;inset:0;z-index:5;background:#0d0d0f;display:grid;place-items:center;padding:24px}
#start[hidden]{display:none}
.card{max-width:420px;width:100%;display:grid;gap:18px}
.card h1{font-size:34px;line-height:1.08;text-wrap:balance}
.card p{color:var(--mute);font-size:16px}
.card ol{color:var(--mute);padding-left:1.2em;display:grid;gap:6px}
.big{min-height:54px;font-size:17px;background:var(--acc);border-color:var(--acc);border-radius:14px;font-weight:600}
#err{color:#ff9d86;font-size:14px;min-height:1em}
.lightbox{height:150px;border-radius:16px;background:linear-gradient(160deg,#fafaf7,#e7e5de);position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px #0002}
.lightbox svg{position:absolute;inset:0;width:100%;height:100%}
@media (prefers-reduced-motion:no-preference){.lightbox .pen{animation:draw 3.2s ease-in-out infinite alternate}}
@keyframes draw{from{stroke-dashoffset:260}to{stroke-dashoffset:0}}
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>

<div id="stage">
  <img id="ov" alt="" hidden draggable="false">
  <svg id="quad" hidden><polygon points=""/></svg>
  <div class="h" data-i="0" hidden></div>
  <div class="h" data-i="1" hidden></div>
  <div class="h" data-i="2" hidden></div>
  <div class="h" data-i="3" hidden></div>
</div>

<div id="bar">
  <div class="row">
    <label class="btn">사진 고르기<input id="file" type="file" accept="image/*"></label>
    <button id="lock" disabled>위치 잠금</button>
    <span class="grow"></span>
    <button id="min" aria-label="패널 접기">접기</button>
  </div>
  <div class="full" id="tools">
    <label class="sl">투명도<input id="op" type="range" min="5" max="100" value="50"><output id="opv">50%</output></label>
    <div class="row">
      <button id="mode" disabled>보기: 원본</button>
      <button id="flip" disabled>좌우 반전</button>
      <button id="reset" disabled>위치 초기화</button>
      <button id="freeze">화면 멈춤</button>
    </div>
    <div id="edgeRow" hidden>
      <label class="sl">선 감도<input id="sens" type="range" min="1" max="100" value="60"><output id="sensv">60</output></label>
      <div class="row">
        <span class="hint">선 색</span>
        <button class="lc on" data-c="0,0,0">검정</button>
        <button class="lc" data-c="230,40,30">빨강</button>
        <button class="lc" data-c="20,90,230">파랑</button>
      </div>
    </div>
    <p class="hint" id="tip">사진을 고른 뒤, 한 손가락으로 이동하고 두 손가락으로 크기와 회전을 조절하세요. 주황 점 4개를 노트 모서리에 맞추면 원근이 보정돼요.</p>
  </div>
</div>

<div id="start">
  <div class="card">
    <div class="lightbox" aria-hidden="true">
      <svg viewBox="0 0 300 150" preserveAspectRatio="xMidYMid slice">
        <g stroke="#c9c6bd" stroke-width="1">
          <line x1="0" y1="30" x2="300" y2="30"/><line x1="0" y1="60" x2="300" y2="60"/><line x1="0" y1="90" x2="300" y2="90"/><line x1="0" y1="120" x2="300" y2="120"/>
        </g>
        <polygon points="70,22 236,34 224,132 58,118" fill="rgba(255,90,54,.10)" stroke="#ff5a36" stroke-width="1.5" stroke-dasharray="6 5"/>
        <path d="M95 100 C110 50 140 45 150 75 S190 110 205 55" fill="none" stroke="#ff5a36" stroke-opacity=".45" stroke-width="5" stroke-linecap="round"/>
        <path class="pen" d="M95 100 C110 50 140 45 150 75 S190 110 205 55" fill="none" stroke="#1b1b1d" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="260" stroke-dashoffset="0"/>
        <g fill="#ff5a36" stroke="#fff" stroke-width="2"><circle cx="70" cy="22" r="6"/><circle cx="236" cy="34" r="6"/><circle cx="224" cy="132" r="6"/><circle cx="58" cy="118" r="6"/></g>
      </svg>
    </div>
    <h1>AR 드로잉 가이드</h1>
    <p>후면 카메라에 비친 노트 위에 내 사진을 겹쳐 보여줘요. 사진은 이 기기 안에서만 처리되고 어디에도 전송되지 않아요.</p>
    <ol>
      <li>폰을 거치대에 고정하고 노트를 비추세요.</li>
      <li>사진을 고르고 모서리 4점을 노트에 맞추세요.</li>
      <li>위치를 잠근 뒤 화면을 보며 따라 그리세요.</li>
    </ol>
    <button class="big" id="go">카메라 켜기</button>
    <p id="err" role="alert"></p>
  </div>
</div>

<script>
{
const $ = s => document.querySelector(s);
const cam = $('#cam'), stage = $('#stage'), ov = $('#ov'), quad = $('#quad'), poly = quad.querySelector('polygon');
const hs = [...document.querySelectorAll('.h')];
const btn = { lock: $('#lock'), mode: $('#mode'), flip: $('#flip'), reset: $('#reset'), freeze: $('#freeze'), min: $('#min') };

let W0 = 0, H0 = 0, P = null, img = null, origURL = null, edgeURL = null;
let mode = 0, flip = false, lineColor = '0,0,0', wl = null;
const MODES = ['원본', '흑백', '윤곽선'];

/* ---------- camera ---------- */
async function startCam() {
  const err = $('#err');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    err.textContent = '이 브라우저에서는 카메라를 쓸 수 없어요. https:// 주소로 열었는지 확인하세요.';
    return;
  }
  try {
    const s = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    cam.srcObject = s;
    await cam.play();
    $('#start').hidden = true;
    wake();
  } catch (e) {
    err.textContent = '카메라를 켤 수 없어요 (' + (e.name || e) + '). 브라우저 설정에서 카메라 권한을 허용했는지 확인하세요.';
  }
}
async function wake() { try { wl = await navigator.wakeLock?.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && cam.srcObject) wake(); });
$('#go').addEventListener('click', startCam);

btn.freeze.addEventListener('click', () => {
  if (!cam.srcObject) return;
  if (cam.paused) { cam.play(); btn.freeze.classList.remove('on'); btn.freeze.textContent = '화면 멈춤'; }
  else { cam.pause(); btn.freeze.classList.add('on'); btn.freeze.textContent = '다시 재생'; }
});

/* ---------- image ---------- */
$('#file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const url = URL.createObjectURL(f);
  const im = new Image();
  im.onload = () => {
    if (origURL) URL.revokeObjectURL(origURL);
    origURL = url; img = im; edgeURL = null;
    const k = Math.min(1, 1400 / Math.max(im.naturalWidth, im.naturalHeight));
    W0 = Math.max(1, Math.round(im.naturalWidth * k));
    H0 = Math.max(1, Math.round(im.naturalHeight * k));
    ov.style.width = W0 + 'px'; ov.style.height = H0 + 'px';
    ov.hidden = false; quad.hidden = false; hs.forEach(h => h.hidden = false);
    Object.values(btn).forEach(b => b.disabled = false);
    fit(); applyMode();
  };
  im.onerror = () => { URL.revokeObjectURL(url); alertTip('이 사진은 열 수 없어요. 다른 형식(JPG/PNG)으로 시도해 보세요.'); };
  im.src = url;
  e.target.value = '';
});

function alertTip(t) { $('#tip').textContent = t; }

function fit() {
  const vw = innerWidth, vh = innerHeight;
  const s = Math.min(vw * 0.8 / W0, vh * 0.55 / H0);
  const w = W0 * s, h = H0 * s, cx = vw / 2, cy = vh * 0.4;
  P = [[cx - w / 2, cy - h / 2], [cx + w / 2, cy - h / 2], [cx + w / 2, cy + h / 2], [cx - w / 2, cy + h / 2]];
  render();
}

/* ---------- perspective (homography → matrix3d) ---------- */
function solve(A, b) {
  const n = b.length;
  for (let c = 0; c < n; c++) {
    let p = c;
    for (let r = c + 1; r < n; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
    if (Math.abs(A[p][c]) < 1e-10) return null;
    [A[c], A[p]] = [A[p], A[c]]; [b[c], b[p]] = [b[p], b[c]];
    for (let r = c + 1; r < n; r++) {
      const f = A[r][c] / A[c][c];
      for (let k = c; k < n; k++) A[r][k] -= f * A[c][k];
      b[r] -= f * b[c];
    }
  }
  const x = new Array(n);
  for (let r = n - 1; r >= 0; r--) {
    let s = b[r];
    for (let k = r + 1; k < n; k++) s -= A[r][k] * x[k];
    x[r] = s / A[r][r];
  }
  return x;
}
function homography(w, h, D) {
  const S = [[0, 0], [w, 0], [w, h], [0, h]], A = [], b = [];
  for (let i = 0; i < 4; i++) {
    const [x, y] = S[i], [X, Y] = D[i];
    A.push([x, y, 1, 0, 0, 0, -x * X, -y * X]); b.push(X);
    A.push([0, 0, 0, x, y, 1, -x * Y, -y * Y]); b.push(Y);
  }
  const m = solve(A, b);
  if (!m || m.some(v => !isFinite(v))) return null;
  return [m[0], m[3], 0, m[6], m[1], m[4], 0, m[7], 0, 0, 1, 0, m[2], m[5], 0, 1];
}
function render() {
  if (!P) return;
  const D = flip ? [P[1], P[0], P[3], P[2]] : P;
  const m = homography(W0, H0, D);
  if (m) ov.style.transform = 'matrix3d(' + m.join(',') + ')';
  hs.forEach((h, i) => h.style.transform = 'translate(' + P[i][0] + 'px,' + P[i][1] + 'px)');
  poly.setAttribute('points', P.map(p => p.join(',')).join(' '));
}

/* ---------- corner handles ---------- */
let drag = null;
hs.forEach((h, i) => {
  h.addEventListener('pointerdown', e => {
    e.stopPropagation();
    h.setPointerCapture(e.pointerId);
    drag = { i, id: e.pointerId, dx: P[i][0] - e.clientX, dy: P[i][1] - e.clientY };
  });
  h.addEventListener('pointermove', e => {
    if (!drag || drag.id !== e.pointerId) return;
    P[drag.i] = [e.clientX + drag.dx, e.clientY + drag.dy];
    render();
  });
  const end = e => { if (drag && drag.id === e.pointerId) drag = null; };
  h.addEventListener('pointerup', end);
  h.addEventListener('pointercancel', end);
});

/* ---------- move / pinch / rotate whole image ---------- */
const pts = new Map();
let snap = null;
function takeSnap() { snap = { P0: P.map(p => p.slice()), S: new Map([...pts].map(([k, v]) => [k, v.slice()])) }; }
stage.addEventListener('pointerdown', e => {
  if (!P || e.target.classList.contains('h')) return;
  stage.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, [e.clientX, e.clientY]);
  takeSnap();
});
stage.addEventListener('pointermove', e => {
  if (!snap || !pts.has(e.pointerId)) return;
  pts.set(e.pointerId, [e.clientX, e.clientY]);
  const ids = [...snap.S.keys()].filter(k => pts.has(k));
  if (ids.length === 1) {
    const a0 = snap.S.get(ids[0]), a1 = pts.get(ids[0]);
    const dx = a1[0] - a0[0], dy = a1[1] - a0[1];
    P = snap.P0.map(([x, y]) => [x + dx, y + dy]);
  } else if (ids.length >= 2) {
    const a0 = snap.S.get(ids[0]), b0 = snap.S.get(ids[1]), a1 = pts.get(ids[0]), b1 = pts.get(ids[1]);
    const c0 = [(a0[0] + b0[0]) / 2, (a0[1] + b0[1]) / 2], c1 = [(a1[0] + b1[0]) / 2, (a1[1] + b1[1]) / 2];
    const d0 = Math.hypot(b0[0] - a0[0], b0[1] - a0[1]) || 1, d1 = Math.hypot(b1[0] - a1[0], b1[1] - a1[1]);
    const r = Math.atan2(b1[1] - a1[1], b1[0] - a1[0]) - Math.atan2(b0[1] - a0[1], b0[0] - a0[0]);
    const s = d1 / d0, cs = Math.cos(r) * s, sn = Math.sin(r) * s;
    P = snap.P0.map(([x, y]) => {
      const u = x - c0[0], v = y - c0[1];
      return [c1[0] + u * cs - v * sn, c1[1] + u * sn + v * cs];
    });
  }
  render();
});
const up = e => { if (!pts.delete(e.pointerId)) return; if (pts.size) takeSnap(); else snap = null; };
stage.addEventListener('pointerup', up);
stage.addEventListener('pointercancel', up);

/* ---------- view modes ---------- */
function makeEdge() {
  const c = document.createElement('canvas');
  c.width = W0; c.height = H0;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(img, 0, 0, W0, H0);
  const d = g.getImageData(0, 0, W0, H0), px = d.data, n = W0 * H0;
  const gray = new Float32Array(n), bl = new Float32Array(n);
  for (let i = 0; i < n; i++) gray[i] = px[i * 4] * 0.299 + px[i * 4 + 1] * 0.587 + px[i * 4 + 2] * 0.114;
  for (let y = 1; y < H0 - 1; y++) for (let x = 1; x < W0 - 1; x++) {
    let s = 0;
    for (let j = -1; j <= 1; j++) for (let k = -1; k <= 1; k++) s += gray[(y + j) * W0 + x + k];
    bl[y * W0 + x] = s / 9;
  }
  const sens = +$('#sens').value, thr = (101 - sens) * 3.2 + 20;
  const [cr, cg, cb] = lineColor.split(',').map(Number);
  const out = g.createImageData(W0, H0), o = out.data;
  for (let y = 1; y < H0 - 1; y++) for (let x = 1; x < W0 - 1; x++) {
    const i = y * W0 + x;
    const gx = bl[i - W0 + 1] + 2 * bl[i + 1] + bl[i + W0 + 1] - bl[i - W0 - 1] - 2 * bl[i - 1] - bl[i + W0 - 1];
    const gy = bl[i + W0 - 1] + 2 * bl[i + W0] + bl[i + W0 + 1] - bl[i - W0 - 1] - 2 * bl[i - W0] - bl[i - W0 + 1];
    const m = Math.hypot(gx, gy);
    if (m > thr) { const q = i * 4; o[q] = cr; o[q + 1] = cg; o[q + 2] = cb; o[q + 3] = Math.min(255, 140 + (m - thr)); }
  }
  g.putImageData(out, 0, 0);
  edgeURL = c.toDataURL('image/png');
}
function applyMode() {
  if (!img) return;
  btn.mode.textContent = '보기: ' + MODES[mode];
  $('#edgeRow').hidden = mode !== 2;
  if (mode === 2) {
    if (!edgeURL) makeEdge();
    ov.src = edgeURL; ov.style.filter = 'none';
  } else {
    ov.src = origURL; ov.style.filter = mode === 1 ? 'grayscale(1) contrast(1.25)' : 'none';
  }
}
btn.mode.addEventListener('click', () => { mode = (mode + 1) % 3; applyMode(); });
let sensT = 0;
$('#sens').addEventListener('input', e => {
  $('#sensv').textContent = e.target.value;
  clearTimeout(sensT);
  sensT = setTimeout(() => { edgeURL = null; applyMode(); }, 180);
});
document.querySelectorAll('.lc').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.lc').forEach(x => x.classList.toggle('on', x === b));
  lineColor = b.dataset.c; edgeURL = null; applyMode();
}));

/* ---------- other controls ---------- */
$('#op').addEventListener('input', e => { ov.style.opacity = e.target.value / 100; $('#opv').textContent = e.target.value + '%'; });
ov.style.opacity = 0.5;
btn.flip.addEventListener('click', () => { flip = !flip; btn.flip.classList.toggle('on', flip); render(); });
btn.reset.addEventListener('click', fit);
btn.lock.addEventListener('click', () => {
  const on = document.body.classList.toggle('locked');
  btn.lock.classList.toggle('on', on);
  btn.lock.textContent = on ? '잠금 해제' : '위치 잠금';
});
btn.min.addEventListener('click', () => {
  const on = document.body.classList.toggle('min');
  btn.min.textContent = on ? '펼치기' : '접기';
});
}
</script>
</body>
</html>
